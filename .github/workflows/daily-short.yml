name: Daily YouTube Pipeline

on:
  workflow_dispatch:
    inputs:
      video_type:
        description: "Manual run mode. All production runs generate Shorts."
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - shorts

  schedule:
    # Three Shorts every day, Monday-Sunday.
    - cron: "0 8 * * *"
      timezone: "Asia/Kolkata"
    - cron: "0 12 * * *"
      timezone: "Asia/Kolkata"
    - cron: "0 16 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

# Serialize production runs so scheduled/manual jobs cannot race on
# YouTube quota, used_topics.txt, used_media.json, or git push.
concurrency:
  group: daily-youtube-pipeline-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Force compatible MoviePy
        run: |
          python -m pip uninstall -y moviepy || true
          python -m pip install "moviepy==1.0.3"
          python -c "import moviepy; print('MoviePy version:', moviepy.__version__); import moviepy.editor; print('moviepy.editor import: OK')"

      - name: Install yt-dlp EJS
        run: |
          python -m pip install -U "yt-dlp[default]"

      - name: Create YouTube OAuth token
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          VIDEO_PRIVACY: public
        run: |
          python -c "import pickle, os; from google.oauth2.credentials import Credentials; from config import YOUTUBE_SCOPES; c=Credentials(token=None, refresh_token=os.environ['YOUTUBE_REFRESH_TOKEN'], token_uri='https://oauth2.googleapis.com/token', client_id=os.environ['YOUTUBE_CLIENT_ID'], client_secret=os.environ['YOUTUBE_CLIENT_SECRET'], scopes=YOUTUBE_SCOPES); pickle.dump(c, open('youtube_token.pickle','wb')); print('YouTube OAuth token created successfully')"

      - name: Resolve scheduled video type
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          MANUAL_VIDEO_TYPE: ${{ inputs.video_type }}
        run: |
          echo "PIPELINE_VIDEO_TYPE=shorts" >> "$GITHUB_ENV"

      - name: Run AI video pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PIPELINE_TIMEZONE: Asia/Kolkata
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          VIDEO_PRIVACY: public
        run: |
          python -m pipeline

      - name: Save pipeline history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add used_topics.txt used_media.json

          if git diff --cached --quiet; then
            echo "No new pipeline history to save"
          else
            git commit -m "Update YouTube pipeline history"
            git push
          fi
